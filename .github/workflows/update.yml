name: 株価データ更新と公開

on:
  schedule:
    # UTC 22:30 / 07:30 / 13:30 / 21:00 = 日本時間 7:30 / 16:30 / 22:30 / 6:00（各市場の引け後）
    - cron: "30 22 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths-ignore: ["data.json", "stocks.json", "universe.json"]
  workflow_dispatch:
    inputs:
      batch:
        description: "スキャンする銘柄数"
        default: "500"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ライブラリ導入
        run: pip install -q curl_cffi openpyxl
      - name: 指数データ取得
        run: python fetch_data.py
      - name: 個別株スキャン（1回あたり BATCH 銘柄）
        env:
          BATCH: ${{ github.event.inputs.batch || '500' }}
          MAX_MINUTES: "45"
        run: python scan_stocks.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add stocks.json universe.json 2>/dev/null || true
          git diff --cached --quiet && echo "変更なし" || (git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)
      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p site
          cp index.html stocks.html data.json site/
          cp stocks.json site/ 2>/dev/null || echo '{"meta":{"updated":"","universe":0,"scanned":0},"stocks":{}}' > site/stocks.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
